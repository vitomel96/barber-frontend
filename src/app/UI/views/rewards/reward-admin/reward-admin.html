<div class="header-actions">

  <button mat-raised-button color="primary"
          (click)="openCreateDialog()">
    <mat-icon>add</mat-icon>
    Crear Premio
  </button>

  <button mat-stroked-button color="accent"
          (click)="validateHash()">
    <mat-icon>verified</mat-icon>
    Validar Hash
  </button>

</div>

<table mat-table [dataSource]="rewards">

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef> Premio </th>
    <td mat-cell *matCellDef="let r"> {{ r.name }} </td>
  </ng-container>

  <ng-container matColumnDef="points">
    <th mat-header-cell *matHeaderCellDef> Puntos </th>
    <td mat-cell *matCellDef="let r">
      {{ r.required_points }}
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef> Acciones </th>
    <td mat-cell *matCellDef="let r">
      <button mat-icon-button (click)="edit(r)">
        <mat-icon>edit</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="['name','points','actions']"></tr>
  <tr mat-row *matRowDef="let row; columns: ['name','points','actions'];"></tr>

</table>
